<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Splash </title>
    <meta name="description"
      content="Contact us with questions about rafting trips, availability, and planning your next river adventure.">
    <meta name="author" content="Gabriel Nehemias Rengifo Krunfli">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <nav class="header_nav">
            <img src="images/z-splash.png" alt="">
            <div class="menu">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html">Contact Us</a>
            </div>
        </nav>

    </header>
    <main>
        <section>
            <h2>Splash Rafting Company</h2>
            <p class="address">123 Main River Street</p>
            <p class="address">Kolob, California </p>
            <p class="address">+1 999 999 9999</p>
            <p class="address">info@splash.com</p>
        </section>
        <section class="map_section">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d8846.955350580045!2d-71.31612835204663!3d-41.13561195151685!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x961a7b015b59ee15%3A0xf23d40cc67159cb3!2sRafting%20bariloche!5e1!3m2!1ses!2sar!4v1791661455790!5m2!1ses!2sar"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form class="box">
                <div class="quiz-item box">
                    <label for="name">Name
                        <input type="name" name="name" id="name"
                          placeholder="Gabriel Rengifo"></label>
                </div>
                <div class="quiz-item box">
                    <label for="email">Email
                        <input type="email" name="email" id="email"
                          placeholder="gabrielrengifo@mail.com"></label></label>
                </div>
                <div class="quiz-item box">
                    <div class="checkbox">
                        <span>Message Purpose</span>
                        <div>
                            <div class="checkbox">
                                <input type="checkbox" id="Inquiry" name="Inquiry" />
                                <label for="Inquiry">General Inquiry</label>
                            </div>
                            <div class="checkbox">
                                <input type="checkbox" id="Reservation" name="Reservation" />
                                <label for="Reservation">Reservation Question</label>
                            </div>
                            <div class="checkbox">
                                <input type="checkbox" id="Suggestion" name="Suggestion" />
                                <label for="Suggestion">Website Suggestion</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="message">
                    <label for="Message">Message</label>

                    <textarea type="text" name="Message" id="Message"
                      placeholder="type here"></textarea></textarea>
                </div>
                <div class="checkbox">
                    <input type="checkbox" id="susbscribe" name="susbscribe" />
                    <label for="susbscribe">Please Susbscribe me to the monthyly
                        newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>


        </section>
        <section class="serve">
            <h2>We Are Here to Serve You</h2>
            <div class="profile">

                <div>
                    <img src="images/profile.jpg" width="130px" alt="">
                    <span>Employee Profile</span>
                </div>
                <div>
                    <img src="images/profile1.jpg" width="130px" alt="">
                    <span>Employee Profile</span>
                </div>
                <div>
                    <img src="images/profile2.jpg" width="130px" alt="">
                    <span>Employee Profile</span>
                </div>
            </div>

        </section>


    </main>
    <footer>
        <p>© 2026 Whitewater Rafting - Gabriel Rengifo</p>
        <nav class=" socialmedia">
            <a href=""><img src="images/instagram.svg" alt="instagram logo" width="30"></a>
            <a href=""><img src="images/youtube.svg" alt="Youtube logo" width="30"></a>
            <a href=""><img src="images/facebook.svg" alt="facebook logo" width="30"></a>
        </nav>

    </footer>

</body>

</html>
